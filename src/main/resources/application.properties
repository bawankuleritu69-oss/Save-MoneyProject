# ===============================
# DATABASE CONFIGURATION
# ===============================
# Defaults to an embedded H2 database so the app starts locally without MySQL.
# If DB_URL / DB_USERNAME / DB_PASSWORD are set in the environment, those values are used instead.
spring.datasource.url=${DB_URL:jdbc:h2:mem:savemoney_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

# H2 console for local inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8081}

# ===============================
# SESSION CONFIGURATION
# ===============================
server.servlet.session.timeout=30m

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
